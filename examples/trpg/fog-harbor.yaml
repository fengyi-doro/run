          : known, \"history\": s[\"history\"][-4:], \"clock\": s[\"clock\"], \"turn\": s[\"turn\"],\n         \
          \     \"ending\": MODULE[\"endings\"].get(s[\"ending\"], \"\"), \"choices\": choices_for(s)}\n    return\
          \ {\"state\": dumps(s), \"packet\": dumps(packet), \"event\": dumps(event), \"choices\": dumps(choices_for(s))}\n\
          \n\ndef finalize(state, event, narration, choices):\n    s, e, options = validate_state(state), json.loads(event),\
