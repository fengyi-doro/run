          \ 'archive'], 'clue': 'diary', 'npc': '孟姨', 'investigate': '查看许照留在客房的笔记', 'talk': '问孟姨许照最近在担心什么'}, 'archive':\
          \ {'name': '旧档案室', 'description': '镇长周岐站在漏雨的档案柜前。一卷三十年前的海难记录被抽出又塞回，纸页上留着擦痕。', 'neighbors': ['dock', 'inn',\
