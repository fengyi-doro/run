          \    if not prose:\n        prose = e[\"message\"]\n    if e[\"kind\"] == \"rules\":\n        prose =\
          \ RULES\n    roll = e.get(\"roll\")\n    if roll:\n        labels = {\"failure\": \"失败\", \"tie\": \"\
          付出代价的成功\", \"success\": \"成功\", \"style\": \"大成功\"}\n        symbols = \" \".join({-1: \"−\", 0: \"0\"\
          , 1: \"+\"}[d] for d in roll[\"dice\"])\n        mechanic = \"检定：4dF [%s] = %+d；%s %+d；加值 %+d；总计 %d /\
          \ 难度 %d → %s。\" % (\n            symbols, roll[\"dice_sum\"], roll[\"approach\"], roll[\"score\"], roll[\"\
          bonus\"], roll[\"total\"], roll[\"difficulty\"], labels[roll[\"outcome\"]])\n    else:\n        mechanic\
          \ = \"检定：本次无需掷骰。\"\n    if e[\"costs\"]:\n        mechanic += \" 代价：\" + \"；\".join(e[\"costs\"]) + \"\
          。\"\n    if e[\"new_clues\"]:\n        prose += \"\\n\\n线索入册：\\n\" + \"\\n\".join(\"- \" + c[\"title\"\
