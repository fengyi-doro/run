          ], p[\"boost\"]) for p in s[\"players\"]))\n    if s[\"ending\"]:\n        prose += \"\\n\\n结局：\" + MODULE[\"\
          endings\"][s[\"ending\"]]\n    answer = prose + \"\\n\\n\" + mechanic + \"\\n\\n\" + board + \"\\n\\n接下来可以：\\\
          n\" + \"\\n\".join(str(i + 1) + \". \" + c for i, c in enumerate(options))\n    return {\"answer\": answer,\
