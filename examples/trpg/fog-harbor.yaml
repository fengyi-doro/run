version: 0.7.0
kind: app
app:
  name: 雾港跑团 AI · 第十三次钟声
  mode: workflow
  icon: 🎲
  icon_type: emoji
  icon_background: '#DDE8EF'
  description: 原创悬疑短团，1–3 人。AI 主持 + 程序掷骰 + 线索与资源状态 + JSON 存档续玩。首次输入开团。
  use_icon_as_answer_icon: false
workflow:
  graph:
    nodes:
    - id: start_node
      type: custom
      data:
        type: start
        title: 玩家输入 / 存档
        desc: ''
        selected: false
        variables:
        - variable: action
          label: 本回合行动（首次输入：开团）
          type: paragraph
          required: true
          max_length: 1200
          options: []
        - variable: session
          label: 上一回合 session 存档（首次留空）
          type: paragraph
          required: false
          max_length: 16000
          options: []
        - variable: party
          label: 初始队伍，例如 沈砚:调查员;林汐:技师（默认沈砚）
          type: text-input
          required: false
          max_length: 200
          options: []
        - variable: actor
          label: 本回合行动角色姓名（默认第一位）
          type: text-input
          required: false
          max_length: 16
          options: []
        - variable: invoke
          label: 是否花命运点调用特质（行动中说明理由）
          type: select
          required: false
          default: 否
          options:
          - 否
          - 是
      position: &id001
        x: 60
        y: 260
      positionAbsolute: *id001
      width: 244
      height: 90
      selected: false
      sourcePosition: right
      targetPosition: left
    - id: prepare
      type: custom
      data:
        type: code
        title: 读取存档与角色
        desc: ''
        selected: false
        variables:
        - variable: action
          label: action
          type: text-input
          required: true
          options: []
          value_selector:
          - start_node
          - action
        - variable: session
          label: session
          type: text-input
          required: true
          options: []
          value_selector:
          - start_node
          - session
        - variable: party
          label: party
          type: text-input
          required: true
          options: []
          value_selector:
          - start_node
          - party
        - variable: actor
          label: actor
          type: text-input
          required: true
          options: []
          value_selector:
          - start_node
          - actor
        - variable: invoke
          label: invoke
          type: text-input
          required: true
          options: []
          value_selector:
          - start_node
          - invoke
        code: "\"\"\"Bounded game state and authoritative mechanics, embedded in Dify Code nodes.\"\"\"\nimport\
          \ json\nimport random\nimport re\n\n# Replaced by the builder; local tests load the same source material.\n\
          MODULE = {'id': 'fog-harbor-v1', 'title': '落潮镇·第十三次钟声', 'pitch': '雾港、失踪的守灯人、每夜多响一次的钟。你们必须在异常潮水吞没镇子前，找出钟声背后的秘密。',\
          \ 'opening': '秋夜九点，渡船把你们留在落潮镇的码头。停摆三十年的灯塔突然亮起，镇上的钟敲了十三下。旅店老板娘递来守灯人昨晚留下的纸条：‘不要让他们再把名字划掉。’海水正在逆着潮汐上涨。你们受镇议会委托，寻找失踪的守灯人许照。',\
          \ 'truth': '三十年前救生船被镇议会征用搬运贵重货物，十三名船员因此沉没。旧事故名单被涂改，许照重新接通灯塔的共鸣装置，想让遇难者的名字被听见，却引发异常潮汐。他仍被困在塔顶。镇长并非超自然幕后黑手，但一直隐瞒旧案。',\
          \ 'scenes': {'dock': {'name': '雾港码头', 'description': '水面浮着逆流的白沫，废弃渡船旁拴着一只新换缆绳的小艇。卖鱼人阿满不肯离开岸边。', 'neighbors':\
          \ ['inn', 'archive', 'boathouse'], 'clue': 'rope', 'npc': '阿满', 'investigate': '检查渡船旁的新缆绳', 'talk': '问阿满昨夜有没有见到守灯人'},\
          \ 'inn': {'name': '盐灯旅店', 'description': '炉火照着湿漉漉的客人。老板娘孟姨守着一间没有退房的客房，桌上放着守灯人的行李。', 'neighbors': ['dock',\
          \ 'archive'], 'clue': 'diary', 'npc': '孟姨', 'investigate': '查看许照留在客房的笔记', 'talk': '问孟姨许照最近在担心什么'}, 'archive':\
          \ {'name': '旧档案室', 'description': '镇长周岐站在漏雨的档案柜前。一卷三十年前的海难记录被抽出又塞回，纸页上留着擦痕。', 'neighbors': ['dock', 'inn',\
          \ 'boathouse'], 'clue': 'manifest', 'npc': '周岐', 'investigate': '核对三十年前的海难名单', 'talk': '询问周岐旧海难为何只有十二人记录'},\
          \ 'boathouse': {'name': '废船坞', 'description': '锈轨伸进黑水，一架拆下来的铜线圈正轻轻发热。船匠鲁叔把一张布满油渍的线路图压在工具箱下。', 'neighbors':\
          \ ['dock', 'archive', 'lighthouse'], 'clue': 'diagram', 'npc': '鲁叔', 'investigate': '检查铜线圈和灯塔线路图', 'talk':\
          \ '向鲁叔打听通往灯塔的路'}, 'lighthouse': {'name': '白礁灯塔', 'description': '海堤尽头的灯塔把一束惨白的光扫过小镇。铜制装置震动，塔顶传来敲击声，许照正在求救。',\
          \ 'neighbors': ['boathouse'], 'clue': 'signal', 'npc': '许照', 'investigate': '观察铜制装置与塔顶的求救信号', 'talk':\
          \ '隔着楼梯向许照喊话'}}, 'clues': {'rope': {'title': '逆流中的新缆绳', 'text': '许照昨夜把小艇送往白礁灯塔；缆绳烧灼痕与灯塔方向一致。废船坞的海堤可以步行通往灯塔。',\
          \ 'difficulty': 1}, 'diary': {'title': '守灯人的未寄信', 'text': '许照的笔记写着：‘那年不是十二人，是十三人。铜线圈会记住被抹掉的名字。’页角画着档案室的柜号。',\
          \ 'difficulty': 2}, 'manifest': {'title': '被涂改的十三人名单', 'text': '透过纸张可见第十三个名字：陈汐。批注表明当年救生船被征用搬运财物，十三名船员未获救援。周岐承认自己后来隐瞒了这份记录。',\
          \ 'difficulty': 2}, 'diagram': {'title': '共鸣装置线路图', 'text': '线路图说明异常灯光来自共鸣装置。断开主铜线可停止潮汐但会毁掉记录；配合完整名单校准线圈，可以保存证据并平息潮水。',\
          \ 'difficulty': 2}, 'signal': {'title': '塔顶求救', 'text': '许照被困在塔顶，仍然活着。他想公开被抹去的海难名单；装置失控不是他的本意。绞盘可以救他下来。',\
          \ 'difficulty': 1}}, 'endings': {'restore': '你们用完整名单校准了共鸣装置。十三个名字被镇子听见，灯光转为暖色，异常潮汐退去。许照获救，旧案证据得以保存。',\
          \ 'seal': '主铜线被切断，灯塔终于安静，潮水开始回落。你们救出了许照，但装置中的原始记录被毁，追查旧案只能依靠已经收集的线索。', 'rescue': '你们利用绞盘救下许照，带领居民撤往高地。潮水淹过旧街，但人员得以撤离；灯塔的谜仍留给下一次冒险。',\
          \ 'flood': '最后一条海堤被潮水淹没。你们帮助居民撤到高地，落潮镇暂时失守。已取得的证据保留下来，许照仍等待救援。', 'retreat': '队伍已无力继续冒险。渔民将你们带到高地休整，现有线索保留下来；救援和调查暂告一段落。'}}\n\
          APPROACHES = [\"谨慎\", \"机智\", \"华丽\", \"强势\", \"迅捷\", \"隐秘\"]\nROLES = {\n    \"调查员\": {\"scores\": [3,\
          \ 2, 1, 0, 1, 2], \"aspect\": \"总能注意到被忽略的细节\"},\n    \"水手\": {\"scores\": [1, 1, 0, 3, 2, 2], \"aspect\"\
          : \"在风浪里讨生活的人\"},\n    \"技师\": {\"scores\": [2, 3, 1, 2, 1, 0], \"aspect\": \"机器总会留下原因\"},\n}\nKINDS =\
          \ [\"move\", \"investigate\", \"talk\", \"overcome\", \"attack\", \"defend\", \"advantage\", \"finale\"\
          , \"meta\", \"invalid\"]\nRULES = \"本团采用 Fate Accelerated 的轻量改编。四枚骰子各取 -1/0/+1，加上行动方式分值，与难度比较：低于难度失败，相等为付出代价的成功，高出\
          \ 1–2 成功，高出 3 及以上大成功。必要线索即使检定失败也会获得，但潮水加速。每三个有效行动潮水推进一格，失败或平手再推进一格；到 8 格触发撤离结局。压力到 3 的角色退出冒险，全员退出触发休整结局。命运点初始\
          \ 3，明确填写 invoke=是并说明如何调用角色特质才可花 1 点获得 +2。创造优势成功获得一次 +2，下一次检定自动消耗。移动通常不掷骰，潮水达到 6 时需要检定。结束调查须到灯塔：校准需要名单与线路图，切断需要线路图，救人需要塔顶求救线索。攻击按一次危险行动结算，没有完整战术战斗。不会自动控制玩家角色。输入‘规则’或‘回顾’不消耗回合。\"\
          \n\n\ndef dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(\",\", \":\"))\n\
          \n\ndef text(value, limit=160):\n    if not isinstance(value, str):\n        raise ValueError(\"文本字段格式不正确\"\
          )\n    return value.strip()[:limit]\n\n\ndef initial_state(party):\n    entries = [s.strip() for s in\
          \ re.split(r\"[;；\\n]\", party or \"沈砚:调查员\") if s.strip()]\n    if not 1 <= len(entries) <= 3:\n    \
          \    raise ValueError(\"队伍请填写 1–3 人，格式：沈砚:调查员;林汐:技师\")\n    players = []\n    for entry in entries:\n\
          \        parts = re.split(r\"[:：]\", entry)\n        if len(parts) != 2 or parts[1].strip() not in ROLES:\n\
          \            raise ValueError(\"职业可选：调查员、水手、技师；格式：姓名:职业\")\n        name, role = text(parts[0], 16), parts[1].strip()\n\
          \        if not name or any(p[\"name\"] == name for p in players):\n            raise ValueError(\"角色名不能为空或重复\"\
          )\n        players.append({\"name\": name, \"role\": role, \"stress\": 0, \"fate\": 3, \"boost\": 0})\n\
          \    return {\"schema\": 1, \"campaign\": MODULE[\"id\"], \"scene\": \"dock\", \"turn\": 0,\n        \
          \    \"clock\": 0, \"players\": players, \"clues\": [], \"history\": [], \"ending\": \"\"}\n\n\ndef validate_state(raw):\n\
          \    if len(raw) > 16000:\n        raise ValueError(\"存档超过长度限制\")\n    try:\n        s = json.loads(raw)\n\
          \    except (ValueError, TypeError):\n        raise ValueError(\"存档不是有效 JSON，请完整复制 session 输出\")\n   \
          \ if not isinstance(s, dict) or s.get(\"schema\") != 1 or s.get(\"campaign\") != MODULE[\"id\"]:\n   \
          \     raise ValueError(\"存档版本或剧本不匹配\")\n    if s.get(\"scene\") not in MODULE[\"scenes\"] or s.get(\"\
          ending\") not in [\"\", *MODULE[\"endings\"]]:\n        raise ValueError(\"存档地点或结局无效\")\n    for key,\
          \ maximum in [(\"turn\", 9999), (\"clock\", 8)]:\n        if type(s.get(key)) is not int or not 0 <= s[key]\
          \ <= maximum:\n            raise ValueError(\"存档回合或潮水无效\")\n    if not isinstance(s.get(\"clues\"), list)\
          \ or len(s[\"clues\"]) > 5 or any(c not in MODULE[\"clues\"] for c in s[\"clues\"]) or len(set(s[\"clues\"\
          ])) != len(s[\"clues\"]):\n        raise ValueError(\"存档线索无效\")\n    if not isinstance(s.get(\"players\"\
          ), list) or not 1 <= len(s[\"players\"]) <= 3:\n        raise ValueError(\"存档队伍无效\")\n    names, players\
          \ = [], []\n    for p in s[\"players\"]:\n        if not isinstance(p, dict) or p.get(\"role\") not in\
          \ ROLES:\n            raise ValueError(\"存档职业无效\")\n        name = text(p.get(\"name\"), 16)\n       \
          \ if not name or name in names:\n            raise ValueError(\"存档角色名无效\")\n        names.append(name)\n\
          \        clean = {\"name\": name, \"role\": p[\"role\"]}\n        for key, maximum in [(\"stress\", 3),\
          \ (\"fate\", 3), (\"boost\", 2)]:\n            if type(p.get(key)) is not int or not 0 <= p[key] <= maximum:\n\
          \                raise ValueError(\"存档角色数值无效\")\n            clean[key] = p[key]\n        players.append(clean)\n\
          \    if not isinstance(s.get(\"history\"), list) or len(s[\"history\"]) > 10:\n        raise ValueError(\"\
          存档历史无效\")\n    history = [{\"action\": text(h.get(\"action\"), 120), \"event\": text(h.get(\"event\"),\
          \ 200)}\n               for h in s[\"history\"] if isinstance(h, dict)]\n    return {\"schema\": 1, \"\
          campaign\": MODULE[\"id\"], \"scene\": s[\"scene\"], \"turn\": s[\"turn\"],\n            \"clock\": s[\"\
          clock\"], \"players\": players, \"clues\": s[\"clues\"], \"history\": history, \"ending\": s[\"ending\"\
          ]}\n\n\ndef prepare(action, session=\"\", party=\"\", actor=\"\", invoke=\"否\"):\n    action = text(action,\
          \ 1200)\n    if not action:\n        raise ValueError(\"请填写行动，首次输入‘开团’\")\n    state = validate_state(session.strip())\
          \ if session and session.strip() else initial_state(party)\n    operation = \"play\" if session and session.strip()\
          \ else \"open\"\n    if action in [\"规则\", \"帮助\", \"help\"]:\n        operation = \"rules\"\n    elif\
          \ action in [\"回顾\", \"状态\", \"存档\"]:\n        operation = \"recap\"\n    elif state[\"ending\"]:\n  \
          \      operation = \"ended\"\n    elif operation == \"play\" and action in [\"开团\", \"开始\", \"重新开始\"]:\n\
          \        operation = \"recap\"\n    actor = text(actor or state[\"players\"][0][\"name\"], 16)\n    if\
          \ actor not in [p[\"name\"] for p in state[\"players\"]]:\n        raise ValueError(\"行动角色不在队伍中\")\n \
          \   scene = MODULE[\"scenes\"][state[\"scene\"]]\n    context = {\"operation\": operation, \"action\"\
          : action, \"actor\": actor, \"invoke\": invoke == \"是\",\n               \"scene_id\": state[\"scene\"\
          ], \"scene\": scene,\n               \"known_clues\": state[\"clues\"], \"clock\": state[\"clock\"],\n\
          \               \"players\": state[\"players\"], \"history\": state[\"history\"][-4:],\n             \
          \  \"destinations\": {k: v[\"name\"] for k, v in MODULE[\"scenes\"].items()},\n               \"approaches\"\
          : APPROACHES}\n    # No hidden truth or undiscovered clue text goes to either LLM.\n    return {\"state\"\
          : dumps(state), \"context\": dumps(context), \"operation\": operation,\n            \"action\": action,\
          \ \"actor\": actor, \"invoke\": \"是\" if invoke == \"是\" else \"否\"}\n\n\ndef parse_intent(raw):\n   \
          \ try:\n        clean = re.sub(r\"<think>.*?</think>\", \"\", raw, flags=re.S).strip()\n        clean\
          \ = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", clean).strip()\n        obj = json.loads(clean)\n  \
          \      if not isinstance(obj, dict) or obj.get(\"kind\") not in KINDS or obj.get(\"approach\") not in\
          \ APPROACHES:\n            raise ValueError()\n        return {\"kind\": obj[\"kind\"], \"approach\":\
          \ obj[\"approach\"],\n                \"target\": text(obj.get(\"target\", \"\"), 32),\n             \
          \   \"invoke_reason\": text(obj.get(\"invoke_reason\", \"\"), 80)}\n    except (ValueError, TypeError,\
          \ AttributeError):\n        return {\"kind\": \"invalid\", \"approach\": \"谨慎\", \"target\": \"\", \"\
          invoke_reason\": \"\"}\n\n\ndef choices_for(state):\n    if state[\"ending\"]:\n        return [\"回顾\"\
          , \"规则\", \"留空存档开启新团\"]\n    scene = MODULE[\"scenes\"][state[\"scene\"]]\n    choices = []\n    if scene[\"\
          clue\"] not in state[\"clues\"]:\n        choices.append(scene[\"investigate\"])\n    if state[\"scene\"\
          ] == \"lighthouse\":\n        for target, required, label in [\n            (\"restore\", {\"manifest\"\
          , \"diagram\"}, \"用完整名单校准共鸣装置\"),\n            (\"seal\", {\"diagram\"}, \"切断主铜线，停止潮汐\"),\n          \
          \  (\"rescue\", {\"signal\"}, \"操作绞盘救出许照并组织撤离\"),\n        ]:\n            if required <= set(state[\"\
          clues\"]):\n                choices.append(label)\n    for neighbor in scene[\"neighbors\"]:\n       \
          \ choices.append(\"前往\" + MODULE[\"scenes\"][neighbor][\"name\"])\n    choices.append(scene[\"talk\"])\n\
          \    return choices[:3]\n\n\ndef resolve(state, intent, operation, action, actor, invoke=\"否\"):\n   \
          \ s = validate_state(state)\n    p = next(p for p in s[\"players\"] if p[\"name\"] == actor)\n    scene\
          \ = MODULE[\"scenes\"][s[\"scene\"]]\n    plan = parse_intent(intent)\n    event = {\"kind\": operation,\
          \ \"message\": \"\", \"roll\": None, \"new_clues\": [], \"costs\": []}\n    active = operation == \"play\"\
          \ and not s[\"ending\"]\n    if operation == \"open\":\n        event[\"message\"] = MODULE[\"opening\"\
          ]\n    elif operation == \"rules\":\n        event[\"message\"] = RULES\n    elif operation == \"recap\"\
          :\n        event[\"message\"] = \"回顾已发现的线索和最近行动，不推进时间。\"\n    elif operation == \"ended\" or s[\"ending\"\
          ]:\n        event[\"message\"] = MODULE[\"endings\"].get(s[\"ending\"], \"本团已结束。\")\n        active =\
          \ False\n    elif p[\"stress\"] >= 3:\n        event[\"message\"] = actor + \"已退出冒险，请换一位未退出的角色。\"\n  \
          \      active = False\n    elif plan[\"kind\"] in [\"invalid\", \"meta\"]:\n        event[\"message\"\
          ] = \"请描述一个当前场景中的具体行动；规则和回顾可单独输入。\"\n        active = False\n    kind, target = plan[\"kind\"], plan[\"\
          target\"]\n    event[\"intent\"] = {\"kind\": kind, \"approach\": plan[\"approach\"], \"target\": target}\n\
          \    if active and kind == \"move\" and target not in scene[\"neighbors\"]:\n        event[\"message\"\
          ] = \"无法直接到达该地点，请从当前可去的地点选择。\"\n        active = False\n    requirements = {\"restore\": {\"manifest\"\
          , \"diagram\"}, \"seal\": {\"diagram\"}, \"rescue\": {\"signal\"}}\n    if active and kind == \"finale\"\
          \ and (s[\"scene\"] != \"lighthouse\" or target not in requirements or not requirements[target] <= set(s[\"\
          clues\"])):\n        event[\"message\"] = \"还无法进行这项终局行动：需要到达灯塔，并找到相应的线索。\"\n        active = False\n \
          \   if active and kind in [\"investigate\", \"talk\"] and scene[\"clue\"] in s[\"clues\"]:\n        event[\"\
          message\"] = \"这里的核心线索已记录。可以追问细节，或前往其他地点。\"\n        active = False\n    if active:\n        difficulty\
          \ = {\"move\": 2 if s[\"clock\"] >= 6 else 0, \"investigate\": MODULE[\"clues\"][scene[\"clue\"]][\"difficulty\"\
          ],\n                      \"talk\": MODULE[\"clues\"][scene[\"clue\"]][\"difficulty\"], \"overcome\":\
          \ 2, \"attack\": 3,\n                      \"defend\": 2, \"advantage\": 2, \"finale\": 3 if target ==\
          \ \"restore\" else 2}[kind]\n        outcome, margin = \"automatic\", 0\n        if kind != \"move\" or\
          \ difficulty:\n            dice = [random.choice([-1, 0, 1]) for _ in range(4)]\n            score = ROLES[p[\"\
          role\"]][\"scores\"][APPROACHES.index(plan[\"approach\"])]\n            bonus = 0\n            if invoke\
          \ == \"是\" and plan[\"invoke_reason\"] and p[\"fate\"] > 0:\n                p[\"fate\"] -= 1\n      \
          \          bonus += 2\n                event[\"costs\"].append(\"命运点 -1（调用角色特质）\")\n            elif invoke\
          \ == \"是\":\n                event[\"costs\"].append(\"特质未成功调用：需说明理由且有命运点\")\n            if p[\"boost\"\
